# ============================================================
# Production Profile Configuration
# ============================================================

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Database (PostgreSQL) ----------
# REQUIRED: set these env vars on the server (Render Database):
#   RENDER_DATABASE_URL=jdbc:postgresql://host:5432/itjob
#   RENDER_DATABASE_USERNAME=postgres
#   RENDER_DATABASE_PASSWORD=your-strong-password
spring.datasource.url=${RENDER_DATABASE_URL}
spring.datasource.username=${RENDER_DATABASE_USERNAME}
spring.datasource.password=${RENDER_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
# REQUIRED: set JWT_SECRET to a long random string (>= 32 chars) in production
jwt.secret=${JWT_SECRET}

# ---------- Gemini AI ----------
# REQUIRED for AI features: set GEMINI_API_KEY on the server
# (property must be present — app won't start without it; empty value disables AI calls)
gemini.api.key=${GEMINI_API_KEY}

# ---------- Cloudinary ----------
# REQUIRED for resume uploads: set these env vars on the server
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:itjob-portal/resumes}

# ---------- Email (SMTP) ----------
# SendGrid SMTP on port 2525 - Render free tier blocks outbound SMTP ports 25/465/587.
# These env vars OVERRIDE the system_config DB values (set them in Render's Environment tab):
#   SMTP_HOST=smtp.sendgrid.net
#   SMTP_PORT=2525
#   SMTP_USERNAME=apikey
#   SMTP_PASSWORD=<your SendGrid API key, starts with SG.>
#   SMTP_SENDER_EMAIL=<the email you verified in SendGrid - REQUIRED, unverified senders are rejected>
app.smtp.host=${SMTP_HOST:smtp.sendgrid.net}
app.smtp.port=${SMTP_PORT:2525}
app.smtp.username=${SMTP_USERNAME:apikey}
app.smtp.sender-email=${SMTP_SENDER_EMAIL:}
app.smtp.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- File Upload Limits ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- CORS ----------
# IMPORTANT: set CORS_ALLOWED_ORIGINS to your deployed frontend URL, e.g.:
#   CORS_ALLOWED_ORIGINS=https://your-frontend-domain.com
# Multiple origins can be comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- Memory / Performance Tuning (Render free tier: 512 MiB) ----------
# Tomcat thread pool: default is 200 threads (~1 MiB stack each) -> cap to save memory
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
# Hibernate query-plan cache: default 2048 entries, each can be large -> cap to save heap
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=32

# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.itjob=INFO
